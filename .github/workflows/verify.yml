name: Kit checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skills, profiles, references and locked dependencies
        run: python -B scripts/validate_repo.py
      - name: Prepare isolated test folder
        run: python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'kit-tests').mkdir(exist_ok=True)"
      - name: Installer, doctor, release and evaluator tests
        env:
          KIT_TEST_ROOT: ${{ runner.temp }}/kit-tests
        run: python -B -m unittest discover -s tests -v
  tools:
    name: Optional tools and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build isolated tool runtime
        run: |
          python -B scripts/setup-tools.py --runtime-root "$RUNNER_TEMP/kit-runtime"
          runtime=$(find "$RUNNER_TEMP/kit-runtime" -mindepth 1 -maxdepth 1 -type d)
          echo "KIT_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Check Python packages
        run: python -B scripts/audit_tools.py
      - name: Check Node packages and execute representative examples
        run: |
          cd "$KIT_RUNTIME"
          node npm/bin/npm-cli.js audit --omit=dev --userconfig empty.npmrc --cache npm-cache
          node verify.mjs
          python/bin/python -B verify_python.py
      - name: Upstream dependency-audit regression tests
        run: '"$KIT_RUNTIME/python/bin/python" -B -m pytest skills/minwoo-dependency-audit/scripts -q -p no:cacheprovider'
      - name: Install isolated test browser
        run: node "$KIT_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real browser, API, video and migration acceptance cases
        run: python -B evals/verify_practical.py --runtime "$KIT_RUNTIME" --out "$RUNNER_TEMP/practical"
      - name: Accessibility and visual regression acceptance cases
        run: node evals/verify_quality.mjs --runtime "$KIT_RUNTIME" --out "$RUNNER_TEMP/quality"
  release:
    name: Versioned release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [tests, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Package committed files and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B scripts/build_release.py --output "$RUNNER_TEMP/kit-release" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/kit-release/*
          if-no-files-found: error
      - name: Publish verified tag without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release preserved; no assets overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/kit-release/"* --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
